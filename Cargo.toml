[package]
name = "control-training-template"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "control-training-template"
path = "src/main.rs"
test = false
bench = false
harness = false

[dependencies]
cortex-m = { version = "0.7.8", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.6"
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-stm32 = { version = "0.6", default-features = false, features = [
    "stm32h723vg",
    "rt",
    "time-driver-tim2",
    "unstable-pac",
] }
embassy-time = "0.5"
embassy-sync = "0.8"
embedded-can = "0.4"
static_cell = "2.1"
rtt-target = "0.6"

[profile.dev]
opt-level = 1
debug = 2

[profile.release]
opt-level = "s"
debug = 2
lto = "thin"
